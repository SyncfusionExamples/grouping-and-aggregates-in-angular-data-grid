<div class="container">
  <ejs-grid [dataSource]='data' [allowPaging]='true' [pageSettings]='pageSettings' [allowGrouping]='true'>
    <e-columns>
      <e-column field='OrderID' headerText='Order ID' textAlign='right' width=90 [allowGrouping]='false'></e-column>
      <e-column field='CustomerID' headerText='Customer ID' width=120></e-column>
      <e-column field='Freight' headerText='Freight' textAlign='right' format='C2' width=90></e-column>
      <e-column field='OrderDate' headerText='Order Date' textAlign='right' format='yMd' width=120></e-column>
      <e-column field='ShipCountry' headerText='Ship Country' width=120></e-column>
    </e-columns>
    <e-aggregates>
      <e-aggregate>
        <e-columns>
          <e-column field='Freight' type='sum'>
            <ng-template #footerTemplate let-data>Sum: {{data.sum}}</ng-template>
          </e-column>
          <e-column columnName='ShipCountry' type='Custom' [customAggregate]="customAggregateFn">
            <ng-template #footerTemplate let-data>Germany Count: {{data.Custom}}</ng-template>
          </e-column>
        </e-columns>
      </e-aggregate>
      <e-aggregate>
        <e-columns>
          <e-column field='Freight' type='max'>
            <ng-template #footerTemplate let-data>Max: {{data.max}}</ng-template>
          </e-column>
        </e-columns>
      </e-aggregate>
      <e-aggregate>
        <e-columns>
          <e-column field="Freight" type="sum">
            <ng-template #groupFooterTemplate let-data>Sum: {{data.sum}}</ng-template>
          </e-column>
        </e-columns>
      </e-aggregate>
      <e-aggregate>
        <e-columns>
          <e-column field="Freight" type="max">
            <ng-template #groupCaptionTemplate let-data>Max: {{ data.max }}</ng-template>
          </e-column>
        </e-columns>
      </e-aggregate>
    </e-aggregates>
  </ejs-grid>
</div>
